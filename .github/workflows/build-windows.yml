name: Build Windows Portable App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./desktop/MotionLinkVR.sln

      - name: Build solution
        run: dotnet build ./desktop/MotionLinkVR.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test ./desktop/MotionLinkVR.Tests/MotionLinkVR.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish portable Windows app
        shell: pwsh
        run: dotnet publish ./desktop/MotionLinkVR.App/MotionLinkVR.App.csproj --configuration Release --runtime win-x64 --self-contained true --output ./artifacts/windows-x64 -p:PublishSingleFile=true -p:UseAppHost=true

      - name: Prepare artifact package
        shell: pwsh
        run: |
          Compress-Archive -Path ./artifacts/windows-x64/* -DestinationPath ./artifacts/MotionLinkVR-Windows-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionLinkVR-Windows-x64
          path: ./artifacts/MotionLinkVR-Windows-x64.zip
